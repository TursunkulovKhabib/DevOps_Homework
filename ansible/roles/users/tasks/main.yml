---
- name: Create deployer user (admin)
  ansible.builtin.user:
    name: "{{ deployer_user }}"
    shell: /bin/bash
    groups: [sudo, docker, adm, systemd-journal]
    append: true
    password: "!"            # пароль заблокирован — вход только по ключу
    update_password: on_create

- name: Allow deployer passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ deployer_user }}"
    content: "{{ deployer_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s   # битый sudoers сломал бы sudo на всём хосте

- name: Create terraform service user (docker only, no sudo)
  ansible.builtin.user:
    name: "{{ terraform_user }}"
    shell: /bin/bash
    groups: [docker]
    append: true
    password: "!"
    update_password: on_create

- name: Install SSH public key for deployer and terraform
  ansible.posix.authorized_key:
    user: "{{ item }}"
    key: "{{ lookup('ansible.builtin.file', ssh_public_key_file) }}"
    state: present
  loop:
    - "{{ deployer_user }}"
    - "{{ terraform_user }}"
